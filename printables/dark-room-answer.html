<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>جواب الحجرة المظلمة</title>
<style>
@font-face{font-family:"Alexandria";src:url(fonts/Alexandria-ExtraBold.ttf);font-weight:100 900}
@page{size:A3 landscape;margin:0}
*{box-sizing:border-box}
html,body{margin:0}
body{width:420mm;height:297mm;font-family:"Alexandria","DejaVu Sans",sans-serif;color:#0f4a2e;background:#fff;position:relative;overflow:hidden}
.frame{position:absolute;inset:12mm;border:3mm solid #1f7a45;border-radius:14mm}
.frame::before{content:"";position:absolute;inset:4mm;border:1mm solid #d6aa3a;border-radius:10mm}
.corner{position:absolute;width:34mm;height:34mm}
.c1{top:6mm;right:6mm}.c2{top:6mm;left:6mm}.c3{bottom:6mm;right:6mm}.c4{bottom:6mm;left:6mm}
.main{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10mm;direction:rtl}
.small{font-size:26mm;font-weight:800;color:#d6aa3a;line-height:1;padding-top:20mm}
.big{font-size:66mm;font-weight:800;line-height:1;color:#0f4a2e}
.note{position:absolute;left:0;right:0;top:196mm;text-align:center;font-size:15mm;font-weight:600;line-height:1.5;color:#3c6b53;padding:0 24mm;text-wrap:balance}
.dot{position:absolute;left:0;right:0;bottom:30mm;text-align:center;color:#d6aa3a}
.dot svg{width:150mm;height:14mm}
</style>
</head>
<body>
<div class="frame"></div>
<svg class="corner c1" viewBox="0 0 40 40"><g fill="#d6aa3a"><polygon points="20,2 25,15 38,20 25,25 20,38 15,25 2,20 15,15"/></g><circle cx="20" cy="20" r="4" fill="#1f7a45"/></svg>
<svg class="corner c2" viewBox="0 0 40 40"><g fill="#d6aa3a"><polygon points="20,2 25,15 38,20 25,25 20,38 15,25 2,20 15,15"/></g><circle cx="20" cy="20" r="4" fill="#1f7a45"/></svg>
<svg class="corner c3" viewBox="0 0 40 40"><g fill="#d6aa3a"><polygon points="20,2 25,15 38,20 25,25 20,38 15,25 2,20 15,15"/></g><circle cx="20" cy="20" r="4" fill="#1f7a45"/></svg>
<svg class="corner c4" viewBox="0 0 40 40"><g fill="#d6aa3a"><polygon points="20,2 25,15 38,20 25,25 20,38 15,25 2,20 15,15"/></g><circle cx="20" cy="20" r="4" fill="#1f7a45"/></svg>
<div class="main"><span class="small">بيعة</span><span class="big">الرضوان</span></div>
<div class="note">بيعة حدثت في عام ٦ للهجرة، وكانت قبل صلح الحديبية</div>
<div class="dot"><svg viewBox="0 0 150 14"><path d="M0 7H62M88 7H150" stroke="#d6aa3a" stroke-width="1.2" fill="none"/><polygon points="75,1 81,7 75,13 69,7" fill="#d6aa3a"/></svg></div>
</body>
</html>
